<!doctype html>
<html><head><meta charset="utf-8"><title>Drevo Premium ad</title>
<style>
@font-face{font-family:O;font-weight:500;src:url(outfit-latin-500-normal.woff)}
@font-face{font-family:O;font-weight:700;src:url(outfit-latin-700-normal.woff)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F4F2EE}
body{font-family:O,system-ui,sans-serif;color:#0B0C0F;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.a{position:absolute}
#stage{position:absolute;inset:0;overflow:hidden}
#dots{position:absolute;inset:-60px;background-image:radial-gradient(rgba(11,12,15,.07) 2px,transparent 2.4px);background-size:36px 36px}
#glow{position:absolute;width:1400px;height:1400px;left:-160px;top:200px;background:radial-gradient(closest-side,rgba(220,38,38,.10),transparent);pointer-events:none}
/* headline */
#head{left:64px;right:64px;top:150px}
#eyebrow{font:700 28px O;letter-spacing:3.5px;color:#DC2626;display:flex;align-items:center;gap:14px;text-transform:uppercase;height:40px}
#eyebrow i{width:12px;height:12px;border-radius:50%;background:#DC2626;display:inline-block}
#h1{margin-top:14px;font:700 94px/1.0 O;letter-spacing:-3px}
#h1 .w{display:inline-block;margin-right:22px;will-change:transform}
#h1 .r{color:#DC2626;background-image:linear-gradient(rgba(220,38,38,.22),rgba(220,38,38,.22));background-repeat:no-repeat;background-position:0 88%;padding:0 2px}
/* bits */
.win{position:absolute;border-radius:28px;overflow:hidden;box-shadow:0 40px 90px rgba(11,12,15,.18),0 8px 24px rgba(11,12,15,.10)}
.bar{height:56px;display:flex;align-items:center;gap:12px;padding:0 22px}
.dot{width:16px;height:16px;border-radius:50%}
.chip{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font:700 26px O}
#pill{left:64px;top:1462px;height:64px;padding:0 28px;border-radius:999px;background:#0B0C0F;color:#fff;font:700 27px O;display:flex;align-items:center;gap:14px;white-space:nowrap}
#pill b{color:#F87171;font-weight:700}
#foot{left:64px;top:1540px;font:500 22px O;color:rgba(11,12,15,.42)}
#tap{width:110px;height:110px;border-radius:50%;border:5px solid rgba(255,255,255,.95);background:rgba(220,38,38,.35);box-shadow:0 0 0 3px rgba(11,12,15,.25);pointer-events:none;z-index:50}
#cursor{width:44px;height:44px;z-index:51;pointer-events:none}
/* excel */
#xl{background:#fff}
#xl .bar{background:#1D6F42;color:#fff;font:500 22px O}
.rib{height:58px;background:#F3F3F3;border-bottom:1px solid #D6D6D6;display:flex;align-items:center;gap:26px;padding:0 22px;font:500 20px O;color:#444}
.colh{height:30px;display:flex;background:#EFEFEF;border-bottom:1px solid #d0d0d0;font:500 17px O;color:#666}
.colh div{border-right:1px solid #d0d0d0;display:flex;align-items:center;justify-content:center}
.xr{display:flex;height:36px;border-bottom:1px solid #E2E2E2;font:700 21px 'Arial Narrow',Arial,sans-serif;letter-spacing:.2px;align-items:center}
.xr .l{width:560px;padding-left:16px;color:#222}
.xr .v{flex:1;text-align:right;padding-right:18px;color:#111}
#xlTitle{height:46px;background:#1F3B73;color:#fff;font:700 27px Arial,sans-serif;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
.xsel{outline:3px solid #1D6F42;outline-offset:-3px;background:#E8F2EC}
.lab{position:absolute;height:46px;padding:0 18px;border-radius:999px;font:700 22px O;display:flex;align-items:center;gap:10px;z-index:5}
/* presenter (light like the real one) */
#dv,#lap{--acc:#DC2626}
#dv{background:#fff}
#dv .bar{background:#F4F4F5;border-bottom:1px solid #E7E7EA}
.pt{display:flex;align-items:center;justify-content:space-between;padding:18px 28px 0}
.tabs{display:flex;gap:8px;background:#F1F1F3;border-radius:999px;padding:6px}
.tab{padding:10px 24px;border-radius:999px;font:700 24px O;color:#6B6F78}
.tab.on{background:#0B0C0F;color:#fff}
.cmt{font:700 22px O;color:#0B0C0F;background:#F1F1F3;padding:12px 20px;border-radius:999px}
.ttl{padding:22px 28px 0;display:flex;align-items:center;gap:16px}
.no{background:var(--acc);color:#fff;font:700 34px O;padding:6px 16px;border-radius:14px}
.ttl h3{font:700 34px O;letter-spacing:-.5px}
.vrow{display:flex;gap:10px;padding:16px 28px 0}
.vc{padding:10px 20px;border-radius:999px;background:#F1F1F3;font:700 21px O;color:#4B4F58}
.vc.on{background:var(--acc);color:#fff}
.big{padding:14px 28px 0;display:flex;align-items:baseline;gap:14px}
.big b{font:700 128px/1 O;letter-spacing:-5px;color:var(--acc)}
.big span{font:700 32px O;color:#6B6F78}
.ten{display:flex;gap:12px;padding:12px 28px 0}
.tt{flex:1;border-radius:18px;background:#F1F1F3;padding:12px 16px}
.tt small{display:block;font:500 20px O;color:#6B6F78}
.tt b{font:700 30px O}
.tt.on{background:var(--acc);color:#fff}.tt.on small{color:rgba(255,255,255,.85)}
.dep{display:flex;gap:10px;padding:16px 28px 0;align-items:center}
.dep .lb{font:700 22px O;color:#6B6F78;margin-right:6px}
.dc{padding:12px 22px;border-radius:999px;background:#F1F1F3;font:700 24px O;color:#33363d}
.dc.on{background:var(--acc);color:#fff}
.low{display:flex;gap:22px;padding:22px 28px 0}
.photo{width:400px;height:262px;border-radius:22px;background:linear-gradient(160deg,#EEF0F3,#DADDE3);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;position:relative}
.wk{flex:1}
.wr{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font:500 22px O;color:#6B6F78}
.wr b{font:700 28px O;color:#0B0C0F}
.wr.g b{color:#15803D}
.wr.loan{border-top:2px solid #0B0C0F;margin-top:6px;padding-top:10px}
.ncd{display:flex;gap:8px;margin-top:8px}
.nc{padding:7px 14px;border-radius:999px;background:#F1F1F3;font:700 19px O;color:#4B4F58}
.nc.on{background:var(--acc);color:#fff}
.fine{position:absolute;left:28px;right:28px;bottom:18px;font:500 19px O;color:#8B8F98}
/* budget */
#bud{position:absolute;left:0;right:0;top:130px;bottom:0}
.bset{display:flex;gap:16px;align-items:center;padding:6px 28px 0;flex-wrap:nowrap}
.mode{display:flex;background:#F1F1F3;border-radius:999px;padding:6px}
.md{padding:10px 22px;border-radius:999px;font:700 23px O;color:#6B6F78}
.md.on{background:#0B0C0F;color:#fff}
.inp{border:3px solid #E4E4E7;border-radius:16px;padding:8px 18px;font:700 30px O;min-width:190px}
.inp small{display:block;font:500 16px O;color:#8B8F98}
.inp.on{border-color:var(--acc)}
.bcols{position:absolute;left:28px;right:28px;top:120px;bottom:60px}
.bh{position:absolute;top:0;font:700 22px O;display:flex;align-items:center;gap:10px;letter-spacing:1px;text-transform:uppercase}
.bh i{width:12px;height:12px;border-radius:50%}
.br{position:absolute;width:458px;height:98px;border-radius:18px;background:#F6F6F7;display:flex;align-items:center;gap:14px;padding:0 16px 0 10px}
.br .th{width:118px;height:76px;border-radius:12px;background:linear-gradient(160deg,#EEF0F3,#D9DCE2);flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.br .nm{flex:1;min-width:0;font:700 22px/1.2 O}
.br .nm small{display:block;font:500 19px O;color:#6B6F78}
.br .mo{text-align:right;font:700 26px O}
.br .mo small{display:block;font:700 18px O}
/* dark app windows */
.dk{background:#08090c;color:#f2f4f7}
.dk .bar{background:#111318}
#board{position:absolute;top:150px;left:0;height:760px}
.col{position:absolute;top:0;width:330px;height:760px;border-radius:22px;background:#111318;padding:16px}
.colhd{display:flex;align-items:center;gap:10px;font:700 22px O;color:#f2f4f7;height:40px}
.colhd i{width:12px;height:12px;border-radius:50%}
.colhd span{margin-left:auto;color:#848b98;font-weight:500}
.lc{position:absolute;left:16px;width:298px;height:132px;border-radius:16px;background:#181b21;padding:16px}
.lc b{display:block;font:700 23px O}
.lc small{display:block;font:500 18px O;color:#a3a9b5;margin-top:4px}
.lc .ago{position:absolute;right:14px;top:16px;font:500 16px O;color:#848b98}
.lc .pr{position:absolute;left:16px;bottom:14px;font:700 19px O;color:#f2f4f7}
#hero{z-index:20;background:#1f232a;box-shadow:0 24px 50px rgba(0,0,0,.5)}
#drawer{position:absolute;top:56px;bottom:0;width:620px;background:#111318;border-left:1px solid rgba(255,255,255,.06);padding:30px;z-index:30}
.dbtn{display:flex;align-items:center;justify-content:center;height:76px;border-radius:18px;font:700 25px O;background:#181b21;color:#f2f4f7;flex:1}
.dbtn.red{background:linear-gradient(180deg,#ef4444,#dc2626);box-shadow:0 2px 0 #991b1b,0 10px 24px rgba(220,38,38,.35)}
.act{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;background:#181b21;margin-top:12px;font:500 22px O;color:#a3a9b5}
.act b{color:#f2f4f7;font-weight:700}
.act i{width:12px;height:12px;border-radius:50%;background:#6ee7b7;flex:none}
#modal{position:absolute;left:30px;right:30px;bottom:30px;border-radius:24px;background:#1f232a;padding:26px;z-index:40;box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.mc{padding:16px 22px;border-radius:999px;background:#2a2e36;font:700 23px O;color:#f2f4f7}
.mc.on{background:#dc2626}
.toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:#f2f4f7;color:#0B0C0F;border-radius:999px;padding:14px 26px;font:700 23px O;display:flex;gap:12px;align-items:center;z-index:45;white-space:nowrap}
.toast i{width:14px;height:14px;border-radius:50%;background:#16a34a}
/* listing cards */
.lcard{position:absolute;left:60px;width:960px;height:262px;border-radius:30px;background:#111318;color:#f2f4f7;display:flex;gap:26px;padding:22px;box-shadow:0 30px 70px rgba(11,12,15,.22)}
.lcard .ph{width:300px;height:218px;border-radius:20px;background:linear-gradient(160deg,#2a2e36,#16181d);flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.lcard .pill{position:absolute;left:12px;top:12px;background:rgba(110,231,183,.16);color:#6ee7b7;font:700 17px O;padding:6px 12px;border-radius:999px}
.lcard h4{font:700 32px/1.15 O;margin-top:6px}
.lcard .var{font:500 22px O;color:#a3a9b5;margin-top:4px}
.lcard .px{font:700 30px O;margin-top:12px}
.stats{display:flex;gap:16px;margin-top:16px}
.stat{display:flex;align-items:center;gap:10px;background:#181b21;border-radius:14px;padding:10px 16px;font:500 21px O;color:#a3a9b5}
.stat b{font:700 30px O;color:#f2f4f7}
.stat.wa b{color:#6ee7b7}
/* studio */
#stu .rail{position:absolute;left:0;top:56px;bottom:0;width:96px;background:#111318;display:flex;flex-direction:column;align-items:center;gap:26px;padding-top:28px}
#stu .rail div{width:52px;height:52px;border-radius:14px;background:#181b21}
#canvasA{position:absolute;left:150px;top:96px;width:450px;height:800px;border-radius:14px;overflow:hidden;background:#222}
.tool{position:absolute;right:28px;width:330px;height:90px;border-radius:18px;background:#181b21;display:flex;align-items:center;gap:16px;padding:0 20px;font:700 25px O;color:#f2f4f7}
.tool i{width:46px;height:46px;border-radius:12px;background:#2a2e36;display:flex;align-items:center;justify-content:center;flex:none}
.tool.on{background:#dc2626}
.bd{position:absolute;width:96px;height:96px;border-radius:16px;border:3px solid transparent}
.bd.on{border-color:#fff}
/* poster */
#lp{background:#080C14;color:#fff;border-radius:26px;overflow:hidden}
.lpT{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-radius:16px;background:#111827;margin:0 22px 12px;font:700 28px O}
.lpT small{font:500 20px O;color:#9CA3AF}
.phone{position:absolute;border-radius:58px;background:#0B0C0F;padding:16px;box-shadow:0 40px 90px rgba(11,12,15,.25)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#fff}
/* mini page */
.url{position:absolute;left:16px;right:16px;top:14px;height:58px;border-radius:999px;background:#F1F1F3;display:flex;align-items:center;gap:10px;padding:0 20px;font:500 24px O;color:#33363d;z-index:5;white-space:nowrap}
.url b{color:#0B0C0F;font-weight:700}
.car2{border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 6px 18px rgba(30,41,90,.08)}
.car2 .im{height:150px;background:linear-gradient(160deg,#EEF0F6,#D7DCE8);display:flex;align-items:center;justify-content:center}
.car2 .tx{padding:12px 14px;font:700 20px/1.2 O}
.car2 .tx small{display:block;font:500 16px O;color:#6B6F78}
.car2 .tx em{display:block;font-style:normal;color:#1d4ed8;margin-top:6px}
/* cta */
#cta{position:absolute;left:0;right:0;top:0;bottom:0}
.btn{position:absolute;left:140px;right:140px;height:130px;border-radius:40px;background:linear-gradient(180deg,#ef4444,#dc2626);color:#fff;display:flex;align-items:center;justify-content:center;gap:18px;font:700 54px O;box-shadow:0 4px 0 #991b1b,0 30px 60px rgba(220,38,38,.35)}
#flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0;z-index:90}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(11,12,15,.10));z-index:80}
</style></head>
<body>
<div id="stage">
  <div id="dots"></div><div id="glow"></div>
  <div id="world" class="a" style="inset:0"></div>
  <div id="head" class="a"><div id="eyebrow"></div><div id="h1"></div></div>
  <div id="pill" class="a"></div>
  <div id="foot" class="a"></div>
  <div id="tap" class="a"></div>
  <svg id="cursor" class="a" viewBox="0 0 24 24"><path d="M4 2l15 11-7 1-3 7z" fill="#0B0C0F" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <div id="vig"></div><div id="flash"></div>
</div>
<script src="film.js"></script>
</body></html>
