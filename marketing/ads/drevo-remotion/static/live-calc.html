<!doctype html>
<!-- Static ad, 1080x1920. Look = STYLE.md (60 white / 30 red / 10 black). Screens = the real
     LivePresenter in `basic` (free) mode: node static/shots.cjs. Render: node static/render.cjs -->
<meta charset="utf-8">
<style>
@font-face{font-family:Outfit;font-weight:400 500;src:url(../harness/outfit-latin-500-normal.woff)}
@font-face{font-family:Outfit;font-weight:600 800;src:url(../harness/outfit-latin-700-normal.woff)}
:root{--w:#fff;--r:#dc2626;--r2:#ef4444;--k:#0B0C0F;--m:rgba(11,12,15,.55)}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:Outfit;font-weight:700;color:var(--k);position:relative;
  background:linear-gradient(#fff 0,#fff 55%,#F1F1F3 65.6%)}
.floor{position:absolute;left:0;right:0;top:1260px;bottom:0;background:linear-gradient(#ef4444 0,#dc2626 22%,#a51b1b 100%)}
.floor:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.55)}
.glow{position:absolute;left:-200px;top:520px;width:900px;height:700px;background:radial-gradient(closest-side,rgba(220,38,38,.07),transparent)}
.col{position:absolute;left:60px;width:840px}
.logo{top:226px;text-align:center}.logo img{height:58px}
h1{top:304px;text-align:center;font-size:100px;line-height:1.03;letter-spacing:-4px;white-space:nowrap}
h1 b{color:var(--r);font-weight:700;display:block}
.sub{display:none;top:530px;text-align:center;font-size:33px;line-height:1.25;font-weight:500;color:var(--m)}
.price{top:552px;height:116px;border-radius:58px;background:var(--k);color:#fff;display:flex;align-items:center;justify-content:center;gap:26px;
  box-shadow:0 18px 40px rgba(11,12,15,.22)}
.price small{font-size:26px;letter-spacing:4px;color:rgba(255,255,255,.6)}
.price .n{font-size:92px;letter-spacing:-3px;line-height:1}
.price .d{width:2px;height:60px;background:rgba(255,255,255,.22)}
.price .t{font-size:38px;line-height:1.05;color:var(--r2)}.price .t i{display:block;font-style:normal;font-size:24px;font-weight:500;color:rgba(255,255,255,.72);margin-top:4px}
.phone{position:absolute;left:66px;top:756px;width:334px;padding:10px;border-radius:38px;background:var(--k);box-shadow:0 30px 50px rgba(11,12,15,.28)}
.phone img{display:block;width:100%;border-radius:29px}
.shadow{position:absolute;left:30px;top:1272px;width:410px;height:36px;background:radial-gradient(closest-side,rgba(60,0,0,.5),transparent)}
.ticks{position:absolute;left:432px;top:786px;width:468px;display:grid;gap:16px}
.tick{height:74px;border-radius:20px;background:#fff;display:flex;align-items:center;gap:13px;padding:0 18px;font-size:25.5px;letter-spacing:-.4px;white-space:nowrap;
  box-shadow:0 10px 26px rgba(11,12,15,.10),0 0 0 1px rgba(11,12,15,.05)}
.tick svg{flex:none;width:38px;height:38px}
.fine{top:1376px;text-align:center;font-size:23px;line-height:1.3;font-weight:500;color:rgba(255,255,255,.92)}
</style>
<div class="glow"></div><div class="floor"></div>
<div class="col logo"><img src="../../../../public/drevo-logo-dark.png"></div>
<h1 class="col" id="h"></h1>
<div class="col sub" id="sub"></div>
<div class="col price"><small id="pl"></small><span class="n">RM0</span><span class="d"></span><span class="t" id="pt"></span></div>
<div class="shadow"></div>
<div class="phone"><img id="shot"></div>
<div class="ticks" id="ticks"></div>
<div class="col fine" id="fine"></div>
<script>
const q = new URLSearchParams(location.search), lang = q.get('lang') === 'en' ? 'en' : 'ms', v = q.get('v') || 'a';
const COPY = {
  ms: {
    a: ['Kalkulator LIVE', 'untuk SA kereta.'], b: ['“Bulanan berapa?”', 'Jawab terus masa LIVE.'],
    sub: 'Tunjuk ansuran bulanan kepada penonton<br>masa LIVE TikTok & Facebook.',
    pl: 'HARGA', pt: 'Percuma<i>tiada yuran tahunan</i>',
    ticks: ['LIVE TikTok & Facebook', 'Telefon & komputer', 'Kereta baru, terpakai, recon', 'Insurans, NCD & rebat sekali', 'Page sendiri + lead WhatsApp'],
    fine: 'Angka ialah anggaran, bank yang tentukan. Kalkulator asas percuma;<br>kalkulator penuh dalam Premium, RM35 sebulan.',
  },
  en: {
    a: ['The LIVE calculator', 'for car SAs.'], b: ['“How much monthly?”', 'Answer it on your LIVE.'],
    sub: 'Show viewers the monthly instalment<br>on your TikTok & Facebook LIVE.',
    pl: 'PRICE', pt: 'Free<i>no yearly fee</i>',
    ticks: ['TikTok & Facebook LIVE', 'Phone & computer', 'New, used & recon cars', 'Insurance, NCD & rebate in', 'Your own page + WhatsApp leads'],
    fine: 'Figures are estimates, the bank decides. The basic calculator is free;<br>the full calculator is in Premium, RM35 a month.',
  },
}[lang];
const $ = (i) => document.getElementById(i);
$('h').innerHTML = `${COPY[v][0]}<b>${COPY[v][1]}</b>`;
if (v === 'b') $('h').style.fontSize = lang === 'en' ? '84px' : '78px'; if (v === 'b') $('h').style.top = '330px';
$('sub').innerHTML = COPY.sub; $('pl').textContent = COPY.pl; $('pt').innerHTML = COPY.pt; $('fine').innerHTML = COPY.fine;
$('shot').src = `shots/phone-${lang}.png`;
$('ticks').innerHTML = COPY.ticks.map((t) => `<div class="tick"><svg viewBox="0 0 38 38"><circle cx="19" cy="19" r="19" fill="#dc2626"/><path d="M11 19.5l5.5 5.5L27.5 14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>${t}</div>`).join('');
</script>
