		<!--
			Installability. iOS reads NONE of the web manifest for Add to Home Screen
			apart from (since 16.4) the icons, and even there apple-touch-icon still
			wins — without this link iOS screenshots the page and uses THAT as the
			home-screen icon. Points at the existing 192px asset rather than shipping
			a third icon file: iOS downscales to 180 itself, and the PNG is already
			opaque RGB (no alpha), which is what iOS wants since it composites any
			transparency onto black.

			Status bar is 'black', not 'black-translucent': translucent extends the
			web view under the notch and would need safe-area padding auditing on
			every panel. 'black' keeps the current layout exactly as-is and matches
			the #080C14 brand background. viewport-fit=cover is still set so
			env(safe-area-inset-*) resolves for components that opt into it.
		-->
