name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        # Non-blocking to start: surfaces high-severity advisories without failing CI.
        # Tighten to a hard failure once the existing backlog is triaged.
        run: npm audit --audit-level=high || true

      - name: Build
        run: npm run build
        env:
          # Dummy values — CI only checks that the code compiles.
          # Real credentials live in Vercel; Sentry source maps upload on production deploy there.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_SENTRY_DSN: ""
          SENTRY_AUTH_TOKEN: ""
