<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080C14" />
<title>You're offline — ShiftOS</title>
<style>
  /* Self-contained on purpose: this page is served BY the service worker when
     the network has already failed, so it cannot depend on anything that
     itself needs a network fetch (the Google-hosted Bebas Neue font included —
     same reason main.jsx's ErrorFallback silently falls back to sans-serif
     offline). No external requests of any kind belong in this file. */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
    padding: 24px 20px;
    background: #080C14;
    color: #fff;
    font-family: system-ui, -apple-system, sans-serif;
    text-align: center;
  }
  img { width: 56px; height: 56px; border-radius: 12px; opacity: 0.9; }
  h1 { font-size: 18px; font-weight: 700; margin: 0; }
  p { font-size: 14px; color: rgba(255,255,255,0.5); max-width: 320px; margin: 0; line-height: 1.5; }
  button {
    margin-top: 8px; padding: 12px 28px;
    background: #dc2626; color: #fff; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button:active { opacity: 0.85; }
  .status { font-size: 12px; color: rgba(255,255,255,0.35); }
</style>
</head>
<body>
  <img src="/pwa-192x192.png" alt="" />
  <h1>You're offline</h1>
  <p>ShiftOS needs an internet connection for this page. Check your connection and try again — it'll reconnect on its own once you're back.</p>
  <button id="retry" type="button">Try again</button>
  <p class="status" id="status"></p>

  <script>
    // No React here — this file is precached and served directly by the
    // service worker (see vite.config.js runtimeCaching), so it has to work
    // with plain DOM APIs only.
    var statusEl = document.getElementById('status');

    function attempt() {
      statusEl.textContent = 'Checking connection…';
      // Re-navigating to the same URL re-runs the SW's NetworkOnly handler —
      // if the network is back, this fetch (and the real page) succeeds.
      window.location.reload();
    }

    document.getElementById('retry').addEventListener('click', attempt);

    // Auto-recover: the moment the browser reports connectivity, retry
    // without making the user tap anything. This is what makes the page
    // "begone" on its own instead of stranding them on it.
    window.addEventListener('online', attempt);

    if (!navigator.onLine) {
      statusEl.textContent = 'Waiting for a connection…';
    }
  </script>
</body>
</html>
